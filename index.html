<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VN Arcade — オンライン・ビジュアルノベル 5作品</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0b14; color:#f2f2f5; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  button { font-family:inherit; cursor:pointer; }

  /* ===== 作品選択 ===== */
  #select { min-height:100%; padding:28px 16px 48px; background:radial-gradient(1200px 600px at 50% -10%, #2a2140 0%, #0b0b14 60%); }
  #select h1 { text-align:center; font-size:30px; letter-spacing:.14em; margin:10px 0 4px; }
  #select .sub { text-align:center; color:#b9b4d0; font-size:13px; margin-bottom:6px; }
  #select .warn { text-align:center; color:#ff8fa3; font-size:12px; margin-bottom:22px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; max-width:1000px; margin:0 auto; }
  .card { background:#171728; border:1px solid #34345a; border-radius:14px; overflow:hidden; text-align:left; color:#f2f2f5; padding:0; transition:transform .15s, border-color .15s; width:100%; }
  .card:hover { transform:translateY(-3px); border-color:#8f7bff; }
  .card img { width:100%; height:140px; object-fit:cover; display:block; background:#23233d; }
  .card .body { padding:14px 16px 16px; }
  .card h2 { font-size:19px; margin-bottom:4px; }
  .card .hero { color:#ffb7c9; font-size:13px; margin-bottom:8px; }
  .card p { color:#c9c6da; font-size:13px; line-height:1.6; }
  .card .tags { margin-top:10px; font-size:11px; color:#9d97c4; }
  .card .tags .r18 { color:#ff8fa3; border:1px solid #ff8fa3; border-radius:6px; padding:1px 6px; margin-right:6px; }

  /* ===== ゲーム画面 ===== */
  #game { display:none; position:fixed; inset:0; overflow:hidden; background:#000; }
  #bgImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s; }
  #bgGrad { position:absolute; inset:0; background:linear-gradient(160deg,#3b2f5e,#141428 70%); }
  #charImg { position:absolute; left:50%; bottom:0; transform:translateX(-50%); max-height:88%; max-width:92%; object-fit:contain; opacity:0; transition:opacity .4s; filter:drop-shadow(0 6px 24px rgba(0,0,0,.55)); }
  #game.r18mode #charImg { opacity:0 !important; }
  #game.r18mode #bgImg { opacity:0 !important; }
  #game.r18mode #bgGrad { background:radial-gradient(800px 500px at 50% 40%, #241226 0%, #050308 75%); }
  #r18badge { display:none; position:absolute; top:12px; left:12px; background:rgba(120,10,40,.85); border:1px solid #ff8fa3; color:#ffd7e0; font-size:12px; padding:4px 10px; border-radius:999px; z-index:5; }
  #game.r18mode #r18badge { display:block; }

  #toolbar { position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:6; }
  #toolbar button { background:rgba(20,20,40,.72); color:#e8e6f5; border:1px solid #4a4a78; border-radius:8px; font-size:12px; padding:6px 10px; }
  #toolbar button:hover { background:rgba(50,45,90,.85); }

  #textbox { position:absolute; left:0; right:0; bottom:0; padding:14px 16px 20px; background:linear-gradient(transparent, rgba(5,5,14,.88) 22%); z-index:4; cursor:pointer; }
  #namebox { display:inline-block; background:#5a3d99; border:1px solid #9d86e8; color:#fff; font-size:14px; font-weight:700; padding:3px 14px; border-radius:8px 8px 0 0; margin-left:6px; min-height:24px; }
  #namebox:empty { visibility:hidden; }
  #text { background:rgba(10,10,24,.82); border:1px solid #3d3d68; border-radius:10px; padding:14px 16px; font-size:17px; line-height:1.75; min-height:96px; white-space:pre-wrap; }
  #next-ind { text-align:right; color:#cbbfff; font-size:12px; height:16px; animation:blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.15} 50%{opacity:1} }

  /* ===== 選択肢 ===== */
  #choices { display:none; position:absolute; inset:0; z-index:7; background:rgba(3,3,10,.55); flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; }
  #choices button { width:min(520px,88%); background:rgba(24,22,48,.95); color:#fff; border:1px solid #8f7bff; border-radius:12px; font-size:16px; padding:14px 18px; }
  #choices button:hover { background:#3a2f73; }

  /* ===== バックログ ===== */
  #backlog { display:none; position:absolute; inset:0; z-index:8; background:rgba(4,4,12,.94); padding:20px; overflow:auto; }
  #backlog h3 { margin-bottom:12px; }
  #backlog .line { margin-bottom:10px; font-size:14px; line-height:1.7; color:#d8d5ea; }
  #backlog .line b { color:#ffb7c9; }
  #backlog .close { position:sticky; top:0; float:right; background:#2c2c50; color:#fff; border:1px solid #55558c; border-radius:8px; padding:6px 12px; }

  /* ===== 年齢確認 ===== */
  #gate { display:none; position:fixed; inset:0; z-index:20; background:rgba(2,2,8,.9); align-items:center; justify-content:center; padding:20px; }
  #gate .box { background:#1a1a30; border:1px solid #ff8fa3; border-radius:14px; padding:26px; max-width:420px; text-align:center; }
  #gate h3 { color:#ff8fa3; margin-bottom:10px; }
  #gate p { font-size:14px; line-height:1.7; color:#d8d5ea; margin-bottom:18px; }
  #gate .row { display:flex; gap:10px; justify-content:center; }
  #gate button { border-radius:10px; padding:10px 18px; font-size:15px; border:1px solid #55558c; background:#2c2c50; color:#fff; }
  #gate button.yes { background:#7c1d3f; border-color:#ff8fa3; }
</style>
</head>
<body>

<div id="select">
  <h1>VN ARCADE</h1>
  <div class="sub">オンラインで遊べるビジュアルノベル ― 全5作品</div>
  <div class="warn">※ 本サイトには成人向けの文章表現（R18シーンは文章のみ・画像なし）が含まれます。18歳未満の方はプレイできません。</div>
  <div class="cards" id="cards"></div>
</div>

<div id="game">
  <div id="bgGrad"></div>
  <img id="bgImg" alt="">
  <img id="charImg" alt="">
  <div id="r18badge">R18 ― このシーンは文章のみで描写されます</div>
  <div id="toolbar">
    <button id="btnSave">セーブ</button>
    <button id="btnLoad">ロード</button>
    <button id="btnLog">ログ</button>
    <button id="btnTitle">タイトル</button>
  </div>
  <div id="textbox">
    <div id="namebox"></div>
    <div id="text"></div>
    <div id="next-ind">▼</div>
  </div>
  <div id="choices"></div>
  <div id="backlog"><button class="close" id="btnLogClose">閉じる</button><h3>バックログ</h3><div id="logLines"></div></div>
</div>

<div id="gate">
  <div class="box">
    <h3>年齢確認</h3>
    <p>この作品には成人向けの文章表現が含まれます（R18シーンは文章のみで、画像はありません）。<br>あなたは18歳以上ですか？</p>
    <div class="row">
      <button class="yes" id="gateYes">はい、18歳以上です</button>
      <button id="gateNo">いいえ</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   画像の差し替え方法:
   各作品データの images にあるパス（assets/○○.svg）を、
   好きな画像ファイルのパスに書き換えるか、
   同じファイル名のまま中身を差し替えてください。
   画像が読み込めない場合は自動でグラデーション表示になります。
   ============================================================ */
const GAMES = [
{
  id: "sakura",
  title: "桜色シグナル",
  heroine: "さくら（21歳）",
  desc: "桜舞う駅前で、幼なじみと5年ぶりに再会する。写真展デートの先にあるのは、友達のままの春か、それとも――。",
  cover: "assets/sakura_cover.svg",
  r18: true,
  images: { park: "assets/sakura_park.svg", station: "assets/sakura_station.svg", room: "assets/sakura_room.svg", char: "assets/sakura_char.svg" },
  scenes: [
    { id: "a01", bg: "station", name: "", text: "桜の花びらが、駅前のロータリーに雪みたいに舞っていた。\n――5年ぶりの地元。俺はキャリーバッグを引きながら、待ち合わせの時計台を見上げた。" },
    { id: "a02", name: "", text: "「……悠太？」\n後ろから、懐かしい声がした。" },
    { id: "a03", char: true, name: "さくら", text: "やっぱり悠太だ！　わたし、さくら。覚えてる？　高校のとき、隣の席だった――" },
    { id: "a04", name: "悠太", text: "忘れるわけないだろ。さくら、お前……すげえ綺麗になったな。" },
    { id: "a05", name: "さくら", text: "ふふ、ありがとう。わたし今、近くの写真館で働いてるの。悠太は？　東京の大学、卒業したんだよね。" },
    { id: "a06", name: "", text: "就職で地元に戻ってきたこと、来週から新社会人になることを話すと、さくらは目を輝かせた。" },
    { id: "a07", char: true, name: "さくら", text: "じゃあさ、今度の日曜、空いてる？　わたしの初めての写真展があるの。……来てほしいな、悠太に。" },
    { id: "a08", choice: [
      { text: "「もちろん行くよ」と即答する", jump: "a09", set: { love: 1 } },
      { text: "「予定見てからでいい？」と濁す", jump: "a10", set: { love: 0 } }
    ] },
    { id: "a09", name: "さくら", text: "ほんと！？　……よかった。じゃあ約束ね、指切り！\n（小指を差し出す手が、少しだけ震えていた）", jump: "a11" },
    { id: "a10", name: "さくら", text: "そ、そっか。うん、無理しないで。……招待券、渡しとくね。\n（笑顔のまま、少しだけ目を伏せた）", jump: "a11" },
    { id: "a11", bg: "park", name: "", text: "――日曜日。写真展の会場は、桜並木の続く公園の小さなギャラリーだった。", jump: "a42" },
    { id: "a12", char: true, name: "さくら", text: "来てくれたんだ……！　これ、わたしが一番見てほしかった写真。高校の文化祭のとき、悠太が撮ってくれた桜の写真を、わたしなりに撮り直したの。" },
    { id: "a13", name: "", text: "写真の中の桜は、あの日の放課後とそっくりで。5年間、この人はずっと、あの春を大事に持っていたのだと分かった。" },
    { id: "a14", name: "悠太", text: "さくら。……この写真、すごくいい。お前の気持ちが、まっすぐ伝わってくる。" },
    { id: "a15", name: "さくら", text: "……悠太にそう言ってもらえたら、もう十分。あのね、わたし、ずっと言えなかったことがあって――" },
    { id: "a16", choice: [
      { text: "「俺も同じだ」と気持ちを伝える", jump: "a17", set: { love: 2 } },
      { text: "「今日はありがとう」と話を締める", jump: "a20", set: { love: 0 } }
    ] },
    { id: "a17", name: "悠太", text: "高校のときから、俺もずっとお前が好きだった。社会人になって戻ってきた理由の半分は、正直、お前に会いたかったからだ。" },
    { id: "a18", name: "さくら", text: "……っ！　悠太……わたしも。わたしもずっと、悠太だけだったの。\n（目に涙を浮かべながら、桜色に頬を染めて笑った）" },
    { id: "a19", branch: { flag: "love", min: 2, then: "a21", else: "a20" } },
    { id: "a20", bg: "station", char: true, name: "さくら", text: "今日は来てくれてありがとう。……また、友達として遊ぼうね。\n【NORMAL END ― 友達のままの春】", end: true },
    { id: "a21", bg: "room", name: "", text: "閉館後、二人で並んで歩いた桜並木。どちらからともなく手が触れ、指が絡んだ。\n――その夜、さくらは俺の部屋に寄っていった。" },
    { id: "a22", r18: true, name: "さくら", text: "（ここからは文章のみの描写になります）\n……悠太、今日は帰りたくない。5年分、ずっと我慢してきたの。わたしを、彼女にして？　……全部、初めてをあげる。" },
    { id: "a23", r18: true, name: "", text: "頷くと、さくらは自分から唇を重ねてきた。最初は触れるだけだったキスが、やがて舌を絡め合う深いものに変わる。桜の香りのする髪が頬をくすぐり、震える指がシャツのボタンをひとつずつ外していく。" },
    { id: "a24", r18: true, name: "さくら", text: "んっ、んんっ……悠太の心臓、すごく早い。わたしもだよ……ほら、触ってみて。ずっと悠太のものだった体、確かめて。" },
    { id: "a25", r18: true, name: "", text: "ブラウスのボタンを外し、ブラのホックを解くと、形のいい大きな乳房がふるりと露わになった。先端は既に固く尖っている。手のひらで包んで揉みほぐすと、さくらは甘い声を漏らした。" },
    { id: "a26", r18: true, name: "さくら", text: "あっ……あんっ、悠太、そこ弱いの……。高校のときから、悠太にだけ見せるって決めてたんだよ……もっと触って。" },
    { id: "a27", r18: true, name: "", text: "乳首を指で転がし、舌で舐め上げ、吸い付く。さくらは俺の頭を抱き寄せ、背中を弓なりに反らせた。下着越しでも分かるほど、彼女の秘部は既に濡れそぼっていた。" },
    { id: "a28x", r18: true, name: "さくら", text: "はぁ、はぁ……悠太、わたしも、触っていい？　……わぁ、こんなに大きくなってる。わたしのせいだよね……嬉しい。" },
    { id: "a29", r18: true, name: "", text: "さくらの細い指が、ズボン越しに俺のものを撫でる。やがて二人とも一糸纏わぬ姿になり、ベッドに倒れ込んだ。さくらは恥ずかしそうに太ももを擦り合わせながら、潤んだ瞳で見上げてくる。" },
    { id: "a30", r18: true, name: "さくら", text: "悠太……わたし、初めてだけど、怖くない。だって相手が悠太だもん。……お願い、わたしの中に、来て。ゆっくりでいいから……全部、入れて。" },
    { id: "a31", r18: true, name: "", text: "指で十分に解してから、震える彼女の脚の間に体を割り入れさせる。入り口は固く狭かったが、愛液で滑る感触と共に、少しずつ、深く、俺を受け入れていった。" },
    { id: "a32", r18: true, name: "さくら", text: "うっ……あ、あぁっ……入って、る……悠太のが、わたしの一番奥まで……。すごい、体の中が全部、悠太でいっぱいだよ……" },
    { id: "a33", r18: true, name: "", text: "最初は痛みに眉を寄せていたさくらも、ゆっくりとした抽送に次第に甘い声を上げ始める。膣壁が絡みつくように締まり、二人の接合部からは濡れた音が響いた。" },
    { id: "a34", r18: true, name: "さくら", text: "あんっ、あんっ、あぁ……！　悠太、気持ちいい、気持ちいいよぉ……！　もっと、もっと奥まで突いて……わたし、もう悠太なしじゃダメになっちゃう……" },
    { id: "a35", r18: true, name: "", text: "ペースを上げ、大きな乳房を揉みながら腰を打ち付ける。さくらはシーツを掴み、涙目で喘ぎながら何度も俺の名を呼んだ。やがて彼女の体が大きく跳ね、内壁が強く痙攣する。" },
    { id: "a36", r18: true, name: "さくら", text: "いっ……イク、イッちゃう……！　悠太、悠太ぁ……あああっ……！！　好き、大好き……愛してるぅ……" },
    { id: "a37", r18: true, name: "", text: "絶頂の余韻に震えるさくらを抱きしめながら、俺も限界を迎える。最後の瞬間、彼女は脚を俺の腰に絡め、離さないとばかりにしがみついてきた。" },
    { id: "a38", r18: true, name: "さくら", text: "出して……中に出して、悠太……！　わたしのお腹、悠太の赤ちゃんが欲しいの……。初めても、一番奥も、全部悠太のものにして……" },
    { id: "a39", r18: true, name: "", text: "最奥深く腰を押し付け、熱い迸りを彼女の中へ解き放つ。さくらは歓喜に目を潤ませ、注がれる感触に小さく体を震わせながら、子宮で受け止めるように腰を寄せた。" },
    { id: "a40", r18: true, name: "さくら", text: "あぁ……熱い……悠太のが、いっぱい中に入ってきてる……。わたし、悠太の彼女になれたんだね。……ねえ、もう一回。まだ離れたくないの。", jump: "a53" },
    { id: "a41", r18: true, name: "", text: "その夜、二人は何度も愛し合った。抱き合って眠りに落ちるまで、さくらはずっと俺の胸に頬を寄せていた。窓の外では、桜の花びらが静かに舞い続けていた。" },
    { id: "a28", bg: "room", name: "さくら", text: "……おはよう、悠太。ふふ、恋人の朝って、こんなに幸せなんだね。これからはずっと一緒だよ。\n【GOOD END ― 桜色シグナル】", end: true },
    { id: "a42", bg: "park", name: "", text: "ギャラリーの入り口で、さくらが小さく手を振っていた。白いワンピースに、桜色のカーディガン。待ち合わせらしい待ち合わせに、胸が高鳴る。" },
    { id: "a43", char: true, name: "さくら", text: "お待たせ、悠太。……ねえ、展示を見る前に、少しだけ並木道を歩かない？　今日の桜、すごく綺麗なの。一緒に見たいな。" },
    { id: "a44", name: "悠太", text: "いいよ。……さくらと歩く桜並木、高校の帰り道みたいだな。" },
    { id: "a45", name: "さくら", text: "覚えてる？　悠太、写真部の部室でいつも居眠りしてて、わたしが起こしに行くのが日課だった。……あの頃のわたし、悠太の隣にいる理由がほしくて、わざわざ遠回りしてたんだよ。" },
    { id: "a46", name: "", text: "花びらの舞う並木道。二人の影が寄り添うように伸びていく。さくらは懐かしそうに目を細め、時折、俺の顔を盗み見ては微笑んだ。" },
    { id: "a47", name: "さくら", text: "高校の卒業式の日、本当は告白するつもりだったの。でも悠太が東京に行くって聞いて……邪魔しちゃいけないって、引っ込めちゃった。ずっと後悔してたんだ。" },
    { id: "a48", name: "悠太", text: "……俺もだよ。行く前に言えなかったこと、ずっと引っかかってた。だから就職先、地元で探したんだ。" },
    { id: "a49", name: "さくら", text: "ほんとに……？　……ふふ、じゃあ今日は、5年越しのやり直しの日だね。さ、展示を見に行こう。わたしの5年間、全部そこにあるから。" },
    { id: "a50", name: "", text: "手を引かれてギャラリーへ。さくらの手は少し汗ばんで、温かかった。", jump: "a12" },
    { id: "a53", r18: true, name: "", text: "一度休んで、シャワーを浴びた後。それでもさくらは離れようとせず、濡れた髪のまま俺の胸に頬を寄せてきた。下半身は既に、再び熱を持ち始めている。" },
    { id: "a54", r18: true, name: "さくら", text: "ねえ悠太……わたし、もう我慢できない。さっきの余韻で、体が疼いてるの。……今度はわたしが、悠太を気持ちよくしてあげる。" },
    { id: "a55", r18: true, name: "", text: "さくらはベッドに俺を押し倒すと、胸に舌を這わせながら下へと降りていく。初めてのはずの口づけは熱心で、舌を絡め、吸い付くたびに喉を鳴らした。" },
    { id: "a56", r18: true, name: "さくら", text: "んっ、んんっ……悠太の、熱い……。わたしの口、気持ちいい？　……もっと奥まで。悠太のもの、わたしの喉で味わいたいの。" },
    { id: "a57", r18: true, name: "", text: "奉仕に限界まで膨らんだところで、さくらは自ら跨ってきた。濡れそぼった秘部が、先端を飲み込んでいく。初めての体位に、彼女は眉を寄せながらも腰を沈めていった。" },
    { id: "a58", r18: true, name: "さくら", text: "あぁっ……入ってく……わたし、自分から悠太の中に……えっちだね、わたし。でも止まらない……悠太が見てる前で、腰、動いちゃう……" },
    { id: "a59", r18: true, name: "", text: "大きな乳房を揺らしながら、さくらは夢中で腰を振る。膣壁がうねるように絡みつき、結合部からは愛液が溢れて太ももを伝った。さくらの喘ぎは、もう隠す気配もない。" },
    { id: "a60", r18: true, name: "さくら", text: "あんっ、あんっ、あぁっ……！　悠太、すごい、奥が擦れて……！　わたし、悠太の上でこんなに乱れてる……見て、もっと見てぇ……" },
    { id: "a61", r18: true, name: "", text: "腰を掴んで下から突き上げると、さくらは大きく絶頂した。そのまま体位を変え、後ろから深く貫くと、彼女はシーツに顔を埋めて嬌声を上げ続けた。" },
    { id: "a62", r18: true, name: "さくら", text: "イグ、またイッちゃう……！　悠太、悠太ぁ……！　好き、大好き……もう、わたしの体は悠太専用なの……！" },
    { id: "a63", r18: true, name: "", text: "高まる限界。さくらは後ろからでも分かるほど子宮を寄せ、二度目の種付けを求めるように腰を落としてきた。" },
    { id: "a64", r18: true, name: "さくら", text: "また中にちょうだい……！　わたしのお腹、悠太の赤ちゃんでいっぱいにして……初めての夜に、二回も……幸せすぎて壊れちゃう……" },
    { id: "a65", r18: true, name: "", text: "最奥で二度目の射精。さくらは歓喜に震え、注がれる熱を子宮で受け止めながら、小さく何度も絶頂を繰り返した。溢れた白濁がシーツに広がっていく。" },
    { id: "a66", r18: true, name: "さくら", text: "あぁ……いっぱい……わたしのお腹、ぽかぽかしてる……。悠太、愛してる。ずっとずっと、わたしだけの彼氏でいてね……", jump: "a41" }
  ]
},
{
  id: "misaki",
  title: "真夜中のコンビニ",
  heroine: "美咲（22歳）",
  desc: "深夜バイトの先輩・美咲と過ごす静かな夜勤。雨の夜、閉店後の店内で二人の距離が縮まっていく。",
  cover: "assets/misaki_cover.svg",
  r18: true,
  images: { store: "assets/misaki_store.svg", street: "assets/misaki_street.svg", room: "assets/misaki_room.svg", char: "assets/misaki_char.svg" },
  scenes: [
    { id: "b01", bg: "store", name: "", text: "深夜1時のコンビニ。客足の途絶えた店内に、蛍光灯の低い唸りだけが響く。\n俺の夜勤バイトも、今日で3か月目になった。" },
    { id: "b02", char: true, name: "美咲", text: "悠太くん、おつかれさま。はい、あったかいコーヒー。……ねえ、今日の夜勤、わたしと二人だけだって。知ってた？" },
    { id: "b03", name: "悠太", text: "美咲さんのおかげで、仕事だいぶ覚えました。……二人だけって、ちょっと緊張しますね。" },
    { id: "b04", name: "美咲", text: "あら、緊張？　ふふ、可愛い。……あ、雨、強くなってきたね。天気予報じゃ、朝まで止まないって。" },
    { id: "b05", name: "", text: "窓の外は本格的な雨。閉店作業を終える頃には、傘があってもずぶ濡れになるような土砂降りだった。", jump: "b38" },
    { id: "b06", char: true, name: "美咲", text: "……ねえ悠太くん。わたしの家、このすぐ近くなの。雨が止むまで、うちで休んでいかない？　夜食も作るし。" },
    { id: "b07", choice: [
      { text: "「お邪魔します」と素直に甘える", jump: "b08", set: { love: 1 } },
      { text: "「店で朝まで待ちます」と遠慮する", jump: "b09", set: { love: 0 } }
    ] },
    { id: "b08", name: "美咲", text: "うん、決まり。じゃあシャッター閉めたら一緒に出よう。……ふふ、なんだかドキドキするね、わたしも。", jump: "b10" },
    { id: "b09", name: "美咲", text: "もう、遠慮しなくていいのに。……でも、悠太くんがそう言うなら。ホットコーヒー、もう一杯入れるね。", jump: "b14" },
    { id: "b10", bg: "room", name: "", text: "美咲さんの家は、店から歩いて3分のワンルームだった。雨に濡れた制服を脱ぎ、借りた部屋着に着替える。" },
    { id: "b11", char: true, name: "美咲", text: "はい、オムライス。バイト先じゃ分からないでしょ、わたし料理得意なんだよ。……どう？　美味しい？" },
    { id: "b12", name: "悠太", text: "……めちゃくちゃ美味いです。美咲さん、仕事もできて料理も上手くて、完璧ですね。" },
    { id: "b13", name: "美咲", text: "完璧なんかじゃないよ。……一人暮らしの夜は、結構寂しいんだから。悠太くんと夜勤の日だけ、ちょっと楽しみだったの。" },
    { id: "b14", branch: { flag: "love", min: 1, then: "b15", else: "b19" } },
    { id: "b15", name: "", text: "食器を片付けた後も、話は尽きなかった。雨音だけが遠くで響く部屋。気づけば、二人の距離は手の届くところまで縮んでいた。" },
    { id: "b16", name: "美咲", text: "ねえ悠太くん。……わたしのこと、どう思ってる？　先輩として、じゃなくて。一人の女の子として。" },
    { id: "b17", choice: [
      { text: "「好きです。ずっと前から」と答える", jump: "b18", set: { love: 2 } },
      { text: "「尊敬してます」と無難に返す", jump: "b19", set: { love: 0 } }
    ] },
    { id: "b18", name: "美咲", text: "……！　本当に？　……やった。わたしもだよ、悠太くん。初めてシフトが被った日から、ずっと気になってた。", jump: "b20" },
    { id: "b19", bg: "street", char: true, name: "美咲", text: "雨、上がったみたい。……今日はありがとう、悠太くん。また夜勤でね。\n【NORMAL END ― 雨上がりの帰り道】", end: true },
    { id: "b20", r18: true, name: "美咲", text: "（ここからは文章のみの描写になります）\nじゃあ……今夜は帰さない。わたしの気持ち、体ごと受け止めて？　悠太くん。" },
    { id: "b21", r18: true, name: "", text: "美咲さんは自分から腕を回し、唇を重ねてきた。コーヒーと雨の匂いのするキス。舌を絡め合ううちに、いつもの頼れる先輩の顔は消え、甘えたような女の表情だけが残った。" },
    { id: "b22", r18: true, name: "美咲", text: "んんっ……悠太くん、思ったより大胆……。いいよ、もっと。わたし、全部悠太くんに見せてあげる。……ほら、脱がせて？" },
    { id: "b23", r18: true, name: "", text: "部屋着のボタンを外すと、下着に包まれた豊かな乳房が露わになる。ブラを外し、掌で揉みしだくと、美咲さんはくすぐったそうに身を捩りながら甘い吐息を零した。" },
    { id: "b24", r18: true, name: "美咲", text: "あぁん……っ、悠太くんの手、熱い……。わたしもう、ずっとこうされたかったの。先輩のくせに、年下に夢中だなんて……ね？" },
    { id: "b25x", r18: true, name: "", text: "乳首を摘まみ、舌で転がすたび、美咲さんの声は高くなる。下着の中に手を滑らせると、秘部はとろとろに濡れていた。指で陰唇を割り開き、クリトリスを撫でると、彼女の腰が跳ねた。" },
    { id: "b26x", r18: true, name: "美咲", text: "あっ、あぁっ……！　そこ、だめ……感じすぎちゃう……。悠太くん、意地悪……でも、止めないで。もっと、わたしをめちゃくちゃにして……" },
    { id: "b27x", r18: true, name: "", text: "指を膣内へ沈めると、熱い内壁が吸い付くように絡んでくる。抽送に合わせて美咲さんは乱れ、やがて俺のものを求めるように手を伸ばしてきた。" },
    { id: "b28x", r18: true, name: "美咲", text: "わたしも触る。……すごい、こんなに硬くて熱い。悠太くん、早く……早くわたしの中に入れて。もう我慢できないの……" },
    { id: "b29x", r18: true, name: "", text: "ベッドに押し倒し、脚を広げさせて一気に貫く。美咲さんは大きく目を見開き、背を反らせて嬌声を上げた。熟れた膣は俺の形に合わせて締め付け、抽送のたびに淫らな水音を立てる。" },
    { id: "b30x", r18: true, name: "美咲", text: "あぁん、あぁっ……！　悠太くん、深い、奥まで届いてる……！　気持ちいい、すごく気持ちいい……もっと激しくして、先輩を堕として……" },
    { id: "b31x", r18: true, name: "", text: "豊満な乳房を掴み、乳首を弄びながら腰を打ち付ける。美咲さんは俺の背に爪を立て、何度も絶頂を迎えながら乱れ続けた。体位を変え、後ろから突き上げると、声が一層高くなる。" },
    { id: "b32x", r18: true, name: "美咲", text: "イグ、またイッちゃう……！　悠太くん、好き、好きぃ……！　あぁっ、もう、わたし、悠太くんの彼女で幸せ……！" },
    { id: "b33x", r18: true, name: "", text: "限界を迎えた俺が中を告げると、美咲さんは脚を絡めて逃がさないとばかりに抱きついてきた。" },
    { id: "b34x", r18: true, name: "美咲", text: "中がいいの……中にちょうだい、悠太くん……！　わたしのお腹、悠太くんの子でいっぱいにして……責任取って、彼女なんだから……！" },
    { id: "b35x", r18: true, name: "", text: "最奥に押し込み、熱い精液を注ぎ込む。美咲さんは歓喜に震え、注がれるたび小さく喘ぎながら、全てを受け止めるように腰を密着させた。" },
    { id: "b36x", r18: true, name: "美咲", text: "あぁ……いっぱい出たね……わたしの中、悠太くんのでいっぱい……。ふふ、幸せ。……ねえ、今夜はまだ長いよ？　もう一回戦、しよっか。", jump: "b49" },
    { id: "b37x", r18: true, name: "", text: "二人は夜明け前まで何度も求め合った。雨上がりの空が白み始める頃、美咲さんは腕の中で穏やかな寝息を立てていた。" },
    { id: "b26", bg: "room", name: "美咲", text: "おはよう、悠太くん。……ふふ、これからはプライベートでも『先輩』じゃなくていいよ。わたしは悠太くんの、彼女だから。\n【GOOD END ― 真夜中のコンビニ】", end: true },
    { id: "b38", bg: "store", name: "", text: "閉店作業の合間、バックヤードで二人だけの休憩。美咲さんは缶コーヒーを差し出し、隣に腰を下ろした。制服の袖が、わずかに触れ合う距離。" },
    { id: "b39", char: true, name: "美咲", text: "悠太くんって、彼女いるの？　……いない？　ふふ、じゃあ聞くけど、好きなタイプは？　年上は、どう？" },
    { id: "b40", name: "悠太", text: "年上、いいと思います。美咲さんみたいに、頼れて、でもたまに甘い人が……って、すみません、言いすぎました。" },
    { id: "b41", name: "美咲", text: "……あら。ふふ、悠太くん、顔真っ赤だよ？　……ねえ、連絡先、交換しよ。バイトの連絡だけじゃなくて、普通に話したいな、わたし。" },
    { id: "b42", name: "", text: "スマホを交換し、連絡先を登録する。美咲さんのアイコンは、私服姿の笑顔だった。心臓の音が、自分でも分かるくらい大きい。" },
    { id: "b43", name: "美咲", text: "今度、バイトじゃない日にどこか行こうよ。……約束ね。さ、雨の様子、見てくる。", jump: "b06" },
    { id: "b49", r18: true, name: "", text: "二回戦の誘いに頷くと、美咲さんは嬉しそうに微笑み、シャワーで汗を流した俺をキッチンへ連れていった。濡れた髪、バスローブ一枚の姿が目に毒だ。" },
    { id: "b50", r18: true, name: "美咲", text: "今度はわたしがリードする番。悠太くんは座ってて。……先輩の本気、見せてあげる。" },
    { id: "b51", r18: true, name: "", text: "美咲さんは跪き、俺のものを口に含んだ。舌を絡め、深く咥え込み、頬を凹ませて吸い上げる。年上の余裕のある奉仕に、腰が震える。" },
    { id: "b52", r18: true, name: "美咲", text: "んんっ……どう？　先輩、上手でしょ。……悠太くんの顔、とろけてる。可愛い。でも、まだ出しちゃだめだよ。次は、中でね。" },
    { id: "b53", r18: true, name: "", text: "バスローブを脱ぎ捨て、美咲さんはキッチンのカウンターに手をついた。豊かな尻を突き出し、濡れた秘部を見せつけるように腰を揺らす。" },
    { id: "b54", r18: true, name: "美咲", text: "後ろから、来て……悠太くんの好きなように、激しく突いて。わたし、もうとろとろなの……早く、壊れるくらいにして……" },
    { id: "b55", r18: true, name: "", text: "腰を掴み、一気に貫く。美咲さんはカウンターに身を伏せ、大きな乳房を揺らしながら喘いだ。後背位の深さに、膣壁が締め付けを強めていく。" },
    { id: "b56", r18: true, name: "美咲", text: "あぁん、あぁっ……！　深い、奥に当たってる……！　悠太くん、すごい、わたし、立ってられない……もっと、もっとぉ……！" },
    { id: "b57", r18: true, name: "", text: "髪を軽く掴み、乳房を後ろから揉みながら突き上げると、美咲さんは何度も絶頂を繰り返した。ベッドへ移動し、今度は彼女が上に跨る。" },
    { id: "b58", r18: true, name: "美咲", text: "今度はわたしが動く番。……見てて、悠太くん。彼女のえっちな姿、全部あなたのものだよ……あんっ、あぁっ……！" },
    { id: "b59", r18: true, name: "", text: "騎乗位で腰を振る美咲さんは、蕩けた顔で自ら深く沈み込ませる。限界が近づくと、彼女は膣を強く締め、逃がさないとばかりに腰を落とし切った。" },
    { id: "b60", r18: true, name: "美咲", text: "中、また中でちょうだい……！　二回目も、わたしのお腹いっぱいにして……悠太くんの彼女を、孕ませて……！" },
    { id: "b61", r18: true, name: "", text: "最奥で射精。美咲さんは歓喜に身を震わせ、注がれる感触を味わうようにゆっくり腰を揺すった。白濁が腿を伝い、カウンターの下に雫となって落ちる。" },
    { id: "b62", r18: true, name: "美咲", text: "あぁ……二回も中に出してくれた……。わたし、幸せすぎてどうにかなりそう。……悠太くん、これからも夜勤の日は、わたしの家に直行だよ？", jump: "b37x" }
  ]
},
{
  id: "rin",
  title: "研究室の最終電車",
  heroine: "凛（23歳）",
  desc: "大学院の研究室で徹夜する凛と、学部生の俺。最終電車を逃した夜、二人の距離が静かに近づく。",
  cover: "assets/rin_cover.svg",
  r18: true,
  images: { lab: "assets/rin_lab.svg", campus: "assets/rin_campus.svg", room: "assets/rin_room.svg", char: "assets/rin_char.svg" },
  scenes: [
    { id: "c01", bg: "lab", name: "", text: "夜11時の研究室。モニタの光と、サーバーのファンの音。\n学会発表を明日に控え、大学院生の凛さんはまだデータと睨めっこしていた。" },
    { id: "c02", char: true, name: "凛", text: "悠太、まだいたの。学部生は早く帰りなさい。……と言いたいけど、正直、いてくれると助かる。最後の集計、手伝ってくれる？" },
    { id: "c03", name: "悠太", text: "もちろんです。凛さんには卒論で世話になりましたから。……はい、差し入れの栄養ドリンクとおにぎり。" },
    { id: "c04", name: "凛", text: "……気が利くじゃない。ありがとう。じゃあ遠慮なく。あと2時間で終わらせるわよ、二人で。" },
    { id: "c05", name: "", text: "二人で黙々と作業する時間は、不思議と心地よかった。凛さんの横顔は真剣で、少しだけ疲れが見えた。", jump: "c42" },
    { id: "c06", char: true, name: "凛", text: "……終わった。やっと終わったわ。悠太のおかげ。ねえ、時計見て。……最終電車、もう出た後よ。" },
    { id: "c07", choice: [
      { text: "「俺の部屋、近いので泊まっていいですよ」", jump: "c08", set: { love: 1 } },
      { text: "「研究室で仮眠しましょう」", jump: "c09", set: { love: 0 } }
    ] },
    { id: "c08", name: "凛", text: "……学部生の部屋に泊まる大学院生。噂になったらどうするの。……でも、背に腹は代えられないわね。お言葉に甘えるわ。", jump: "c10" },
    { id: "c09", name: "凛", text: "そうね、それが無難ね。……ソファは私がもらうわ。悠太は椅子で我慢して。", jump: "c16" },
    { id: "c10", bg: "room", name: "", text: "俺のワンルーム。凛さんはシャワーを借り、俺の大きめのTシャツを着て現れた。いつもの白衣姿とのギャップに、心臓が跳ねる。" },
    { id: "c11", char: true, name: "凛", text: "……何よ、じろじろ見て。似合わない？　……ふふ、冗談。ありがとう、悠太。今日は本当に助かった。" },
    { id: "c12", name: "悠太", text: "凛さん、明日の発表、絶対うまくいきますよ。俺、凛さんの研究が一番すごいと思ってますから。" },
    { id: "c13", name: "凛", text: "……あなたって、本当に真っ直ぐよね。そういうところ、昔から……いえ、なんでもない。今夜はもう寝ましょう。" },
    { id: "c14", name: "", text: "布団を譲り、俺が床で丸くなろうとすると、凛さんが小さな声で呼び止めた。" },
    { id: "c15", name: "凛", text: "悠太。……こっち、来なさい。言いたいことがあるの。わたし、あなたのこと――" },
    { id: "c16", branch: { flag: "love", min: 1, then: "c17", else: "c21" } },
    { id: "c17", choice: [
      { text: "「俺も凛さんが好きです」と先に言う", jump: "c18", set: { love: 2 } },
      { text: "言葉を待つ", jump: "c19", set: { love: 2 } }
    ] },
    { id: "c18", name: "凛", text: "……先に言われた。悔しいけど、嬉しい。わたしもよ、悠太。ずっと、あなたが好きだった。", jump: "c20" },
    { id: "c19", name: "凛", text: "わたし、あなたが好き。院生と学部生なんて関係ない。……返事、聞かせて？", jump: "c20" },
    { id: "c20", name: "悠太", text: "俺もです、凛さん。……いえ、凛。俺と付き合ってください。", jump: "c22" },
    { id: "c21", bg: "campus", char: true, name: "凛", text: "昨夜はありがとう。発表、頑張ってくるわ。……また研究室でね、悠太。\n【NORMAL END ― 朝のキャンパス】", end: true },
    { id: "c22", r18: true, name: "凛", text: "（ここからは文章のみの描写になります）\n……じゃあ今夜は、研究の話はおしまい。女としてのわたしを、ちゃんと見て。悠太。" },
    { id: "c23", r18: true, name: "", text: "凛は自分から眼鏡を外し、俺の首に腕を回した。いつも理知的な彼女の、熱っぽい吐息と潤んだ瞳。借りたTシャツ一枚の下の体の熱に、理性が溶けていく。" },
    { id: "c24", r18: true, name: "凛", text: "んっ……悠太、悠太……。わたし、初めてなの。優しく……いえ、あなたの好きにしていい。全部、悠太にあげる。" },
    { id: "c25x", r18: true, name: "", text: "Tシャツを脱がせると、下着姿の凛が現れた。整った体つきに、意外なほど豊かな乳房。ブラを外して揉みほぐすと、凛は耳まで赤くして身を任せた。乳首は既に固く勃ち上がっている。" },
    { id: "c26x", r18: true, name: "凛", text: "あっ……んんっ、悠太、そんなに強く……あぁ、だめ、声が出ちゃう……。研究室じゃ、こんな顔、誰にも見せたことないのに……" },
    { id: "c27x", r18: true, name: "", text: "下着を脱がせ、脚の間へ顔を埋める。秘部は既に愛液で濡れ光り、舌で舐め上げると凛の体が大きく震えた。クリトリスを吸い、舌先で転がすたび、理知的な彼女の口から甘い嬌声が止まらなくなる。" },
    { id: "c28x", r18: true, name: "凛", text: "あぁっ、あああっ……！　悠太、そこ、そこぉ……！　イグ、わたし、もう……あああっ……！！" },
    { id: "c29x", r18: true, name: "", text: "凛は一度大きく絶頂し、荒い息を吐いた。それでも俺を求める手は止まらない。潤み切った入り口に先端を当てがうと、彼女は自分から腰を寄せてきた。" },
    { id: "c30x", r18: true, name: "凛", text: "来て、悠太……わたしの中、あなたで満たして。初めては、あなたに全部壊してほしいの……ゆっくり、奥まで、入れて……" },
    { id: "c31x", r18: true, name: "", text: "狭い膣を割り開きながら、ゆっくりと沈めていく。処女膜を破る感触と共に、凛は痛みに顔を歪めながらも、俺の背にしがみついて離れなかった。最奥まで収まると、二人同時に息を吐く。" },
    { id: "c32x", r18: true, name: "凛", text: "うっ……あぁ、入った……悠太のが、わたしの中に……。熱い、大きい……わたしの体が、あなたの形になっていくみたい……" },
    { id: "c33x", r18: true, name: "", text: "痛みが引くのを待ち、少しずつ腰を動かす。やがて凛の表情から苦痛が消え、快感に目を細め始めた。内壁は抽送のたびに蠢き、絡みつくように締まってくる。" },
    { id: "c34x", r18: true, name: "凛", text: "あんっ、あんっ、あぁ……！　悠太、気持ちいい……！　頭が真っ白になる……もっと、もっと突いて、私をあなたのものにして……！" },
    { id: "c35x", r18: true, name: "", text: "激しく腰を打ち付け、豊かな乳房を揺らす。凛は枕に顔を埋めて喘ぎ、やがて耐えきれず大きな声を上げた。膣が痙攣し、絶頂が彼女を貫く。" },
    { id: "c36x", r18: true, name: "凛", text: "イッてる、またイッちゃう……！　悠太、悠太ぁ……！　好き、大好き……もうあなたなしじゃ、生きていけない……！" },
    { id: "c37x", r18: true, name: "", text: "絶頂の連続に震える凛を抱き、俺も限界を迎えた。凛は俺の顔を引き寄せ、唇を重ねながら囁く。" },
    { id: "c38x", r18: true, name: "凛", text: "中に出して、悠太……！　あなたの子が欲しいの。わたしのお腹で、あなたの赤ちゃんを育てたい……だから、中で、いっぱい出して……！" },
    { id: "c39x", r18: true, name: "", text: "最奥深くで射精する。凛は子宮で受け止めるように腰を押し付け、注がれる熱に歓喜の涙を浮かべた。結合部からは、入りきらなかった白濁が僅かに溢れる。" },
    { id: "c40x", r18: true, name: "凛", text: "あぁ……熱い……いっぱい、出してくれたね……。ふふ、わたし、あなたの彼女で、将来の奥さん。……ねえ悠太、今夜はまだ終わらせない。もう一度、最初からして？", jump: "c53" },
    { id: "c41x", r18: true, name: "", text: "夜が明けるまで、二人は何度も愛を確かめ合った。翌日の学会発表で、凛はいつも以上に輝いていたという。\n――俺だけが知る、あの夜の素顔を胸に秘めて。" },
    { id: "c28", bg: "room", name: "凛", text: "おはよう、悠太。……ふふ、その寝癖。今日からわたしは、あなたの彼女。研究室でも、よろしくね。\n【GOOD END ― 研究室の最終電車】", end: true },
    { id: "c42", bg: "lab", name: "", text: "作業の手を止め、凛さんは小さく伸びをした。肩に手を置くと、思ったより細く、温かい。研究室の蛍光灯の下で、二人だけの時間が流れていく。" },
    { id: "c43", char: true, name: "凛", text: "……悠太、少し聞いて。わたし、来年で卒業なの。就職は、他県の研究所に決まりそうで。……だから、この研究室にいられる時間は、もう長くないのよ。" },
    { id: "c44", name: "悠太", text: "……知らなかった。凛さんがいなくなるなんて、考えたこともなかったです。" },
    { id: "c45", name: "凛", text: "寂しいのは、わたしも同じ。あなたみたいな後輩、もうできないでしょうね。真面目で、優しくて……つい頼ってしまうの、自分でも困ってるくらい。" },
    { id: "c46", name: "", text: "凛さんは自嘲気味に笑い、栄養ドリンクを開けた。少しだけ、目元が潤んでいた気がした。俺は、かける言葉を探して黙り込んでしまう。" },
    { id: "c47", name: "凛", text: "……ごめんなさい、発表前夜に湿っぽくなって。さ、ラストスパートよ。終わったら、ちゃんとお礼をさせて。", jump: "c06" },
    { id: "c53", r18: true, name: "", text: "凛の誘いに、二度目の夜が始まる。今度は凛が主導権を握ろうと、俺をベッドに押し倒し、馬乗りになってきた。眼鏡の奥の瞳が、挑発的に細められる。" },
    { id: "c54", r18: true, name: "凛", text: "今度はわたしが上。悠太は寝てて。……さっきの仕返し、たっぷりしてあげる。わたしの体、もう全部あなたの形を覚えちゃったみたい……" },
    { id: "c55", r18: true, name: "", text: "凛は自ら秘部を擦り付け、濡れた入り口で先端を弄ぶ。焦らすような動きに限界が近づくと、彼女は微笑んでゆっくりと腰を沈めていった。" },
    { id: "c56", r18: true, name: "凛", text: "あぁっ……入って、る……わたしの中、あなたでいっぱい……。悠太、見て。あなたの上で乱れてる、彼女の姿。全部、頭に焼き付けて……？" },
    { id: "c57", r18: true, name: "", text: "凛は大きな乳房を揺らしながら腰を振る。膣壁は一回目より素直に絡みつき、抽送のたびに濡れた音を立てた。乳首を摘まむと、彼女の動きが激しくなる。" },
    { id: "c58", r18: true, name: "凛", text: "あんっ、あんっ、あぁ……！　悠太、気持ちいい……！　わたし、自分からこんなに腰振るなんて……あなたのせいで、淫らな女になっちゃった……" },
    { id: "c59", r18: true, name: "", text: "体位を変え、向かい合って脚を絡める密着位。凛は耳元で甘く囁きながら、深く腰を落としてきた。互いの吐息と鼓動が重なる。" },
    { id: "c60", r18: true, name: "凛", text: "もっと近くにいて……悠太の匂い、声、心臓の音、全部感じたい。……好き、大好き……もう離れたくないの……" },
    { id: "c61", r18: true, name: "", text: "激しく求め合い、凛は何度目かの絶頂で大きく痙攣した。俺も限界を迎え、彼女の名を呼ぶ。" },
    { id: "c62", r18: true, name: "凛", text: "中、また中に出して……！　二回目も、わたしのお腹にちょうだい……あなたの赤ちゃんが、本当に欲しいの……だから、遠慮しないで……！" },
    { id: "c63", r18: true, name: "", text: "最奥深くで二度目の射精。凛は子宮で受け止めるように腰を押し付け、注がれる熱に潤んだ目で微笑んだ。結合部から白濁が溢れ、シーツを汚していく。" },
    { id: "c64", r18: true, name: "凛", text: "あぁ……いっぱい……二回も……。わたし、もう悠太のものだね。体も、心も、将来も。……明日の発表、絶対成功させて、あなたに報告するから。", jump: "c41x" }
  ]
},
{
  id: "yuna",
  title: "閉館後の図書室",
  heroine: "優奈（25歳）",
  desc: "市立図書館の司書・優奈と、閉館後の静かな書庫で過ごす時間。雨宿りの夜、二人の秘密が始まる。",
  cover: "assets/yuna_cover.svg",
  r18: true,
  images: { library: "assets/yuna_library.svg", stacks: "assets/yuna_stacks.svg", room: "assets/yuna_room.svg", char: "assets/yuna_char.svg" },
  scenes: [
    { id: "d01", bg: "library", name: "", text: "市立図書館、閉館30分前。返却本の山を片付けながら、俺はカウンターの優奈さんをちらりと見た。\n週3で通う理由は、半分が本で、半分が彼女だった。" },
    { id: "d02", char: true, name: "優奈", text: "悠太さん、今日も遅くまでお疲れさま。……あら、その本、背表紙が傷んでるわね。よかったら、閉館後に修理を手伝ってくれない？" },
    { id: "d03", name: "悠太", text: "もちろんです。本のことなら何でも手伝います。……優奈さんと残れるなら、なおさら。" },
    { id: "d04", name: "優奈", text: "ふふ、口が上手いのね。じゃあお願いしようかしら。書庫の奥、行ってみましょう。" },
    { id: "d05", bg: "stacks", name: "", text: "閉館後の書庫は、二人だけの世界だった。本の匂いと静寂。優奈さんの手際のよさに習って、古い本の背を直していく。", jump: "d39" },
    { id: "d06", char: true, name: "優奈", text: "本ってね、大事に直せば何十年でも生きるの。人も、きっと同じよね。……悠太さんは、直したいもの、ある？" },
    { id: "d07", choice: [
      { text: "「優奈さんとの距離を、縮めたいです」", jump: "d08", set: { love: 1 } },
      { text: "「特にないです」と無難に答える", jump: "d09", set: { love: 0 } }
    ] },
    { id: "d08", name: "優奈", text: "……あら。ふふ、勇気があるのね。……わたしもね、最近、あなたの来る日が待ち遠しいの。", jump: "d10" },
    { id: "d09", name: "優奈", text: "そう。……じゃあ、今日はここまでにしましょう。雨、降ってきちゃったみたいだけど、大丈夫？", jump: "d15" },
    { id: "d10", name: "", text: "修理を終えた頃、外は激しい雨。優奈さんは窓を見て、小さく溜め息をついた。" },
    { id: "d11", char: true, name: "優奈", text: "困ったわ、傘が一本だけなの。……ねえ悠太さん。今日はわたしの家に寄っていかない？　駅の反対側で遠回りだけど、夕飯も作るわ。" },
    { id: "d12", choice: [
      { text: "「行きます、ぜひ」と答える", jump: "d13", set: { love: 2 } },
      { text: "「申し訳ないので」と辞退する", jump: "d15", set: { love: 0 } }
    ] },
    { id: "d13", bg: "room", name: "", text: "優奈さんの部屋は、本と植物に囲まれた穏やかな空間だった。手料理のパスタを二人で食べ、雨音を聞きながら他愛ない話に笑い合う。" },
    { id: "d14", char: true, name: "優奈", text: "ねえ悠太さん。……わたしのこと、どう思ってるの？　年上の司書なんて、退屈じゃない？" },
    { id: "d15", branch: { flag: "love", min: 2, then: "d16", else: "d20" } },
    { id: "d16", name: "悠太", text: "退屈なんてとんでもない。優奈さんの声も、仕草も、本を選ぶところも、全部好きです。――俺と、付き合ってください。" },
    { id: "d17", name: "優奈", text: "……！　悠太さん……。わたしでいいの？　……ふふ、ありがとう。わたしも、ずっとあなたが気になっていたの。" },
    { id: "d18", name: "", text: "優奈さんは少し照れたように笑い、俺の手を両手で包んだ。その温かさに、長く通った図書館の日々が報われた気がした。" },
    { id: "d19", jump: "d21" },
    { id: "d20", bg: "library", char: true, name: "優奈", text: "今日は手伝ってくれてありがとう。……また本を借りに来てね、悠太さん。\n【NORMAL END ― 閉館後の図書室】", end: true },
    { id: "d21", r18: true, name: "優奈", text: "（ここからは文章のみの描写になります）\nじゃあ、今夜は帰さないわ。……わたしの本当の顔、悠太さんだけに教えてあげる。" },
    { id: "d22", r18: true, name: "", text: "優奈さんは髪を解き、いつもの凛とした司書の顔から、甘く蕩けた表情へと変わっていく。誘うように手が伸び、俺を引き寄せた。重ねた唇は深く、舌を絡め合うたびに吐息が熱くなる。" },
    { id: "d23", r18: true, name: "優奈", text: "んっ……悠太さん、熱い……。わたし、年上なのに、こんなにドキドキしてる。……全部、脱がせて。あなたの手で、わたしをほどいて。" },
    { id: "d24x", r18: true, name: "", text: "ワンピースのファスナーを下ろすと、レースの下着に包まれた豊かな体が現れた。大きな乳房を掌で揉み、乳首を舌で転がすと、優奈さんは喉を反らせて甘い声を零す。" },
    { id: "d25x", r18: true, name: "優奈", text: "あぁん……悠太さん、上手……。図書館では、こんな声、出せないのに……あなたにだけは、全部聞かせてあげる。" },
    { id: "d26x", r18: true, name: "", text: "下着を脱がせ、秘部に指を這わせる。愛液でとろとろに濡れた陰唇を割り開き、中を掻くように指を動かすと、優奈さんの腰が淫らに揺れた。クリトリスを摘まむたび、大きな体が小刻みに震える。" },
    { id: "d27x", r18: true, name: "優奈", text: "あっ、あぁっ……！　だめ、そこ弱いの……！　悠太さん、わたし、もう……イッちゃう、イッ……あああっ……！！" },
    { id: "d28x", r18: true, name: "", text: "絶頂に震える優奈さんを抱き寄せ、今度は俺のものを彼女の手に握らせる。優奈さんは蕩けた瞳のまま、奉仕するように口に含んできた。舌の絡む感触と、吸い付くような口内の熱に、思わず声が漏れる。" },
    { id: "d29x", r18: true, name: "優奈", text: "んっ、んんっ……悠太さんの、熱くて大きい……。ふふ、どう？　わたしの口、気持ちいい？　……もう限界って顔してる。ねえ、早くわたしの中に来て。" },
    { id: "d30x", r18: true, name: "", text: "ベッドに押し倒し、脚を抱え上げて一気に挿入する。熟れた膣は待ちかねたように締め付け、優奈さんは背を反らせて嬌声を上げた。深く腰を落とすたび、接合部から濡れた音が響く。" },
    { id: "d31x", r18: true, name: "優奈", text: "あぁん、あぁっ……！　悠太さん、深い、すごい……！　わたしの中、全部あなたでいっぱい……気持ちいい、気持ちよすぎるぅ……" },
    { id: "d32x", r18: true, name: "", text: "大きな乳房を掴んで揉みながら、激しく腰を打ち付ける。優奈さんは枕を掴み、何度も絶頂を迎えながら乱れた。体位を変え、騎乗位で自ら腰を振る姿は、いつもの司書からは想像もできないほど淫らだった。" },
    { id: "d33x", r18: true, name: "優奈", text: "あんっ、あんっ……！　見て、悠太さん……わたし、自分から腰振ってる……あなたの彼女は、こんなにえっちなんですよ……！" },
    { id: "d34x", r18: true, name: "", text: "再び正常位に戻り、最奥を突き続ける。優奈さんは脚を俺の背に絡め、耳元で甘く囁いた。" },
    { id: "d35x", r18: true, name: "優奈", text: "悠太さん……中に出して、ください……わたし、あなたの赤ちゃんが欲しいの。年上彼女からの、一生のお願い……わたしのお腹、いっぱいにして……！" },
    { id: "d36x", r18: true, name: "", text: "最奥深く腰を沈め、熱い精液を注ぎ込む。優奈さんは歓喜に目を潤ませ、注がれるたび体を震わせながら、全てを子宮で受け止めるように腰を寄せ続けた。" },
    { id: "d37x", r18: true, name: "優奈", text: "あぁ……出てる、いっぱい出てる……わたしの中が、悠太さんで満ちていく……。ふふ、幸せ。……ねえ、今夜は何度でも付き合うわ。彼女を満足させるのは、彼氏の役目でしょ？", jump: "d50" },
    { id: "d38x", r18: true, name: "", text: "夜が更けるまで、二人は幾度も愛を囁き合った。翌朝、図書館のカウンターで交わす視線は、昨日までとは少しだけ違っていた。" },
    { id: "d27", bg: "room", name: "優奈", text: "おはよう、悠太さん。……ふふ、これからは図書館でも家でも、わたしの特等席はあなたのそばね。\n【GOOD END ― 閉館後の図書室】", end: true },
    { id: "d39", bg: "stacks", name: "", text: "書庫の最奥、普段は立ち入り禁止の貴重書棚。優奈さんは指で背表紙をなぞり、静かに微笑んだ。" },
    { id: "d40", char: true, name: "優奈", text: "ここにあるのはね、百年以上前の本たち。触れるだけで、前の持ち主の人生に触れる気がするの。……悠太さんにも、そういう宝物、ある？" },
    { id: "d41", name: "悠太", text: "……あります。この図書館で過ごした時間、ですかね。受験も、就活も、ここで乗り越えてきたので。" },
    { id: "d42", name: "優奈", text: "ふふ、嬉しいこと言うのね。……実はわたし、あなたの貸出カードの記録、覚えてるの。最初は漫画ばかりだったのに、だんだん難しい本に挑戦するようになって。成長を見てるみたいで、楽しかった。" },
    { id: "d43", name: "", text: "優奈さんの言葉に、胸が温かくなる。見守られていたのだ、ずっと。カウンター越しのあの微笑みは、本物だった。" },

/* ================= エンジン ================= */
const $ = (s) => document.querySelector(s);
const elSelect = $("#select"), elGame = $("#game"), elCards = $("#cards");
const elBg = $("#bgImg"), elChar = $("#charImg"), elName = $("#namebox"), elText = $("#text");
const elChoices = $("#choices"), elLog = $("#backlog"), elLogLines = $("#logLines"), elGate = $("#gate");

let G = null;          // 現在の作品
let sceneMap = {};     // id -> {node, index}
let flags = {};
let cur = null;        // 現在のノード
let backlog = [];
let typing = null;     // typewriter timer
let fullText = "";
let ended = false;

GAMES.forEach((g) => {
  const card = document.createElement("button");
  card.className = "card";
  card.innerHTML = `<img src="${g.cover}" alt="" onerror="this.style.display='none'">
    <div class="body"><h2>${g.title}</h2><div class="hero">${g.heroine}</div>
    <p>${g.desc}</p><div class="tags">${g.r18 ? '<span class="r18">R18（文章のみ）</span>' : ''}選択肢・分岐あり／セーブ対応</div></div>`;
  card.addEventListener("click", () => tryStart(g));
  elCards.appendChild(card);
});

let pendingGame = null;
function tryStart(g) {
  if (g.r18 && !sessionStorage.getItem("vn_adult_ok")) { pendingGame = g; elGate.style.display = "flex"; return; }
  startGame(g);
}
$("#gateYes").addEventListener("click", () => { sessionStorage.setItem("vn_adult_ok", "1"); elGate.style.display = "none"; if (pendingGame) startGame(pendingGame); });
$("#gateNo").addEventListener("click", () => { elGate.style.display = "none"; pendingGame = null; });

function startGame(g, save) {
  G = g; flags = save ? (save.flags || {}) : {}; backlog = []; ended = false;
  sceneMap = {}; g.scenes.forEach((n, i) => { sceneMap[n.id] = { node: n, index: i }; });
  elSelect.style.display = "none"; elGame.style.display = "block";
  elBg.style.opacity = 0; elChar.style.opacity = 0;
  goTo(save && save.scene ? save.scene : g.scenes[0].id);
}

function resolve(id) {
  // branch / jump のみのノードは即座に解決する
  let guard = 0;
  while (id && guard++ < 50) {
    const e = sceneMap[id]; if (!e) return null;
    const n = e.node;
    if (n.branch) { const v = flags[n.branch.flag] || 0; const ok = n.branch.min !== undefined ? v >= n.branch.min : v === n.branch.eq; id = ok ? n.branch.then : n.branch.else; continue; }
    if (n.jump && !n.text && !n.choice) { id = n.jump; continue; }
    return n;
  }
  return null;
}

function goTo(id) { const n = resolve(id); if (!n) return toTitle(); cur = n; showNode(n); }

function nextId(n) {
  if (n.jump) return n.jump;
  const e = sceneMap[n.id]; if (!e) return null;
  const nxt = G.scenes[e.index + 1]; return nxt ? nxt.id : null;
}

function setImg(img, src) {
  if (!src) { img.style.opacity = 0; return; }
  if (img.getAttribute("src") === src) { img.style.opacity = 1; return; }
  img.onerror = () => { img.style.opacity = 0; };
  img.onload = () => { img.style.opacity = 1; };
  img.src = src;
}

function showNode(n) {
  if (n.set) applySet(n.set);
  elGame.classList.toggle("r18mode", !!n.r18);
  if (n.r18) { elChar.style.opacity = 0; }
  else {
    if (n.bg) setImg(elBg, G.images[n.bg]);
    if (n.char) setImg(elChar, G.images.char); else if (n.char === false) elChar.style.opacity = 0;
    else { /* char指定なし: 前の状態を維持。地の文では消す */ if (!n.name) elChar.style.opacity = 0; }
  }
  elName.textContent = n.name || "";
  backlog.push({ name: n.name || "", text: n.text || "" });
  ended = !!n.end;
  typeText(n.text || "");
  if (n.choice) showChoices(n.choice);
}

function typeText(t) {
  fullText = t; elText.textContent = "";
  if (typing) clearInterval(typing);
  let i = 0;
  typing = setInterval(() => {
    i += 2; elText.textContent = t.slice(0, i);
    if (i >= t.length) { clearInterval(typing); typing = null; }
  }, 24);
}

function showChoices(list) {
  elChoices.innerHTML = "";
  list.forEach((c) => {
    const b = document.createElement("button");
    b.textContent = c.text;
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      elChoices.style.display = "none";
      if (c.set) applySet(c.set);
      goTo(c.jump);
    });
    elChoices.appendChild(b);
  });
  elChoices.style.display = "flex";
}

function applySet(s) { Object.keys(s).forEach((k) => { flags[k] = (typeof flags[k] === "number" && typeof s[k] === "number" && k === "love") ? Math.max(flags[k], s[k]) : s[k]; }); }

$("#textbox").addEventListener("click", () => {
  if (elChoices.style.display === "flex") return;
  if (typing) { clearInterval(typing); typing = null; elText.textContent = fullText; return; }
  if (ended) return toTitle();
  if (!cur) return;
  if (cur.choice) return; // 選択待ち
  const id = nextId(cur);
  if (id) goTo(id); else toTitle();
});

function toTitle() {
  elGame.style.display = "none"; elSelect.style.display = "block";
  elGame.classList.remove("r18mode"); G = null; cur = null;
}

$("#btnSave").addEventListener("click", (e) => { e.stopPropagation(); if (!G || !cur) return; localStorage.setItem("vn_save_" + G.id, JSON.stringify({ scene: cur.id, flags })); flash("セーブしました"); });
$("#btnLoad").addEventListener("click", (e) => { e.stopPropagation(); if (!G) return; const s = localStorage.getItem("vn_save_" + G.id); if (!s) return flash("セーブデータがありません"); const save = JSON.parse(s); startGame(G, save); flash("ロードしました"); });
$("#btnLog").addEventListener("click", (e) => { e.stopPropagation(); elLogLines.innerHTML = backlog.map((l) => `<div class="line">${l.name ? `<b>${l.name}</b>：` : ""}${l.text.replace(/\n/g, "<br>")}</div>`).join(""); elLog.style.display = "block"; });
$("#btnLogClose").addEventListener("click", () => { elLog.style.display = "none"; });
$("#btnTitle").addEventListener("click", (e) => { e.stopPropagation(); toTitle(); });

function flash(msg) {
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:absolute;top:52px;right:12px;z-index:9;background:rgba(30,28,60,.92);border:1px solid #8f7bff;border-radius:8px;padding:6px 12px;font-size:13px;";
  elGame.appendChild(d); setTimeout(() => d.remove(), 1600);
}
</script>
</body>
</html>
